<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oh-my-doloop Mac 습관 고치기</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<script src="mock.js"></script>
<script src="habit-form.js"></script>
<div class="mock-tools">
  <div class="segmented" role="group" aria-label="테마">
    <button data-theme-set="light">라이트</button>
    <button data-theme-set="dark">다크</button>
  </div>
</div>
<main class="mock-page">
  <section class="device device--mac device--two" aria-label="Mac 습관 고치기">
    <nav class="mac-side" aria-label="사이드바" data-mac-sidebar></nav>
    <div class="mac-main" data-form-host></div>
  </section>
</main>

<script>
const item = MOCK_ITEMS.find((i) => i.id === "r5");
const host = document.querySelector("[data-form-host]");
host.innerHTML = `<form class="form" data-form novalidate>
  <header class="screen-bar"><h1 class="large-title">습관 고치기</h1></header>
  ${formFields(item)}
  <footer class="form-foot">
    <p class="form-foot__note">저장하면 내일부터 적용됩니다. 지난 기록과 통계는 바뀌지 않습니다.</p>
    <div class="actions"><a class="btn btn--anchor" href="${MAC_TODAY}">취소</a><button class="btn btn--primary">저장</button></div>
  </footer>
</form>`;
setupHabitForm(host.querySelector("form"), item, { onSave: () => showToast("저장했습니다. 내일부터 적용됩니다") });
renderMacSidebar("today");
</script>
</body>
</html>
