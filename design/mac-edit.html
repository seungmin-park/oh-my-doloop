<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oh-my-doloop Mac 습관 고치기</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<script src="mock.js"></script>
<div class="mock-tools">
  <div class="segmented" role="group" aria-label="테마">
    <button data-theme-set="light">라이트</button>
    <button data-theme-set="dark">다크</button>
  </div>
</div>
<main class="mock-page">
  <section class="device device--mac device--two" aria-label="Mac 습관 고치기">
    <nav class="mac-side" aria-label="사이드바" data-mac-sidebar></nav>
    <div class="mac-main">
      <form class="form" data-form novalidate>
        <header class="screen-bar"><h1 class="large-title">습관 고치기</h1></header>

        <label class="form-row"><span class="form-row__label">이름</span>
          <span class="form-row__value"><input class="text-input" name="title" value="일기 세 줄" aria-describedby="title-error"><span class="form-error" id="title-error" data-title-error hidden>이름을 입력하세요</span></span></label>
        <label class="form-row"><span class="form-row__label">상황</span>
          <span class="form-row__value"><input class="text-input" name="context" value="자기 전"></span></label>
        <div class="form-row"><span class="form-row__label">작게·크게</span>
          <span class="form-row__value form-row__pair"><input class="text-input" aria-label="작은 목표" placeholder="작은 목표" value="한 줄 쓰기"><input class="text-input" aria-label="큰 목표" placeholder="큰 목표" value="한 쪽 쓰기"></span></div>

        <div class="form-row"><span class="form-row__label">하루 횟수</span>
          <span class="form-row__value stepper"><button type="button" class="btn" data-count="-1" aria-label="하루 횟수 줄이기">−</button><output data-count-value>1</output><button type="button" class="btn" data-count="1" aria-label="하루 횟수 늘리기">+</button></span></div>

        <div class="form-row"><span class="form-row__label">반복</span>
          <span class="form-row__value form-row__stack">
            <span class="chips" role="group" aria-label="반복 방식" data-repeat>
              <button type="button" class="chip" aria-pressed="true" data-kind="daily">매일</button>
              <button type="button" class="chip" aria-pressed="false" data-kind="days">요일 지정</button>
              <button type="button" class="chip" aria-pressed="false" data-kind="weekly">주 n회</button>
            </span>
            <span class="weekdays" role="group" aria-label="반복 요일" data-weekdays></span>
            <span class="stepper" data-weekly hidden><button type="button" class="btn" data-weekly-step="-1" aria-label="주 횟수 줄이기">−</button><output data-weekly-value>3</output><span>회</span><button type="button" class="btn" data-weekly-step="1" aria-label="주 횟수 늘리기">+</button></span>
            <span class="form-error" data-weekday-error hidden>요일을 하나 이상 고르세요</span>
          </span></div>

        <div class="form-row" data-time-root><span class="form-row__label">언제</span>
          <span class="form-row__value form-row__stack">
            <span class="chips" role="group" aria-label="시간대" data-demo-chips>
              <button type="button" class="chip" aria-pressed="false" data-band="아침">아침</button>
              <button type="button" class="chip" aria-pressed="false" data-band="낮">낮</button>
              <button type="button" class="chip" aria-pressed="true" data-band="저녁">저녁</button>
              <button type="button" class="chip" aria-pressed="false" data-band="">안 정함</button>
            </span>
            <div class="time-picker time-picker--form" data-time-picker>
              <div class="time-picker__head">
                <span>정확한 시각 <span class="time-picker__value" data-time-value></span></span>
                <button type="button" class="switch" role="switch" aria-checked="false" aria-label="정확한 시각 사용" data-time-switch><span class="switch__thumb"></span></button>
              </div>
              <div class="time-wheel" data-time-wheel hidden>
                <span class="time-wheel__band"></span>
                <div class="time-wheel__col" data-wheel="period"></div>
                <div class="time-wheel__col" data-wheel="hour"></div>
                <div class="time-wheel__col" data-wheel="minute"></div>
              </div>
            </div>
          </span></div>

        <div class="form-row"><span class="form-row__label">묶음</span>
          <span class="form-row__value chips" role="group" aria-label="루틴 묶음" data-group>
            <button type="button" class="chip" aria-pressed="false">아침 루틴</button>
            <button type="button" class="chip" aria-pressed="true">저녁 루틴</button>
            <button type="button" class="chip" aria-pressed="false">없음</button>
          </span></div>

        <footer class="form-foot">
          <p class="form-foot__note">저장하면 내일부터 적용됩니다. 지난 기록과 통계는 바뀌지 않습니다.</p>
          <div class="actions"><a class="btn btn--anchor" href="today.html">취소</a><button class="btn btn--primary">저장</button></div>
        </footer>
      </form>
    </div>
  </section>
</main>

<script>
const WEEK = ["월", "화", "수", "목", "금", "토", "일"];
const picked = new Set([0, 1, 2, 3, 4, 5, 6]);
let kind = "daily";
let count = 1;
let weekly = 3;

const root = document.querySelector("[data-time-root]");
const picker = setupPicker(root);

function renderRepeat() {
  document.querySelectorAll("[data-repeat] .chip").forEach((chip) => chip.setAttribute("aria-pressed", chip.dataset.kind === kind));
  const days = document.querySelector("[data-weekdays]");
  days.hidden = kind !== "days";
  days.innerHTML = WEEK.map((w, i) => `<button type="button" class="weekday" aria-pressed="${picked.has(i)}" data-weekday="${i}" aria-label="${w}요일">${w}</button>`).join("");
  document.querySelector("[data-weekly]").hidden = kind !== "weekly";
  document.querySelector("[data-weekly-value]").textContent = weekly;
  document.querySelector("[data-count-value]").textContent = count;
  document.querySelector("[data-weekday-error]").hidden = kind !== "days" || picked.size > 0;
}

document.addEventListener("click", (e) => {
  const band = e.target.closest("[data-demo-chips] .chip");
  const repeat = e.target.closest("[data-repeat] .chip");
  const day = e.target.closest("[data-weekday]");
  const step = e.target.closest("[data-count]");
  const weeklyStep = e.target.closest("[data-weekly-step]");
  const group = e.target.closest("[data-group] .chip");
  if (band) {
    pressChip(band.parentElement, band.dataset.band);
    picker.setBand(band.dataset.band);
  } else if (repeat) {
    kind = repeat.dataset.kind;
    renderRepeat();
  } else if (day) {
    const i = Number(day.dataset.weekday);
    if (picked.has(i)) picked.delete(i);
    else picked.add(i);
    renderRepeat();
    document.querySelector(`[data-weekday="${i}"]`).focus();
  } else if (step) {
    count = Math.min(9, Math.max(1, count + Number(step.dataset.count)));
    renderRepeat();
  } else if (weeklyStep) {
    weekly = Math.min(6, Math.max(1, weekly + Number(weeklyStep.dataset.weeklyStep)));
    renderRepeat();
  } else if (group) {
    group.parentElement.querySelectorAll(".chip").forEach((chip) => chip.setAttribute("aria-pressed", chip === group));
  }
});

document.querySelector("[data-form]").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = e.target.elements.title;
  const missing = !title.value.trim();
  document.querySelector("[data-title-error]").hidden = !missing;
  title.setAttribute("aria-invalid", missing);
  if (missing) {
    title.focus();
    return;
  }
  if (kind === "days" && picked.size === 0) {
    document.querySelector("[data-weekday-error]").hidden = false;
    return;
  }
  showToast("저장했습니다. 내일부터 적용됩니다");
});

renderMacSidebar("today");
renderRepeat();
</script>
</body>
</html>
